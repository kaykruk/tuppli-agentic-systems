name: Tuppli Lead Generation Pipeline

on:
  schedule:
    # Runs daily at 10:00 AM UTC (6:00 AM EST)
    # Timed so Gemini free-tier quota has fully reset
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      max_leads:
        description: 'Maximum leads to scrape and sync'
        required: false
        default: '15'
      query_limit:
        description: 'Number of search queries to run'
        required: false
        default: '10'
      city:
        description: 'Target city override (e.g. Chicago, Dallas)'
        required: false
        default: ''

jobs:
  scrape_and_sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scrapers/lead_gen/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scrapers/lead_gen/requirements.txt

      - name: Configure Google Service Account Key
        env:
          SERVICE_ACCOUNT_KEY: ${{ secrets.SERVICE_ACCOUNT_KEY }}
        run: |
          echo "$SERVICE_ACCOUNT_KEY" > scrapers/lead_gen/service_account.json

      - name: Run Lead Generation Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SPREADSHEET_ID: '14k9pAVjqmWh6ukQo3S2JV2kdUkV-fazy8TnqkYI-1Zc'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_NUMBER: ${{ secrets.TWILIO_WHATSAPP_NUMBER }}
          USER_WHATSAPP_NUMBER: ${{ secrets.USER_WHATSAPP_NUMBER }}
        run: |
          MAX_LEADS="${{ github.event.inputs.max_leads || '15' }}"
          QUERIES="${{ github.event.inputs.query_limit || '10' }}"
          CITY="${{ github.event.inputs.city }}"
          
          CMD="python scrapers/lead_gen/run_pipeline.py --max $MAX_LEADS --queries $QUERIES"
          if [ -n "$CITY" ]; then
            CMD="$CMD --city \"$CITY\""
          fi
          
          echo "Executing: $CMD"
          eval $CMD
