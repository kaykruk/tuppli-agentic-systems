global:
  scrape_interval: 15s

rule_files:
  - "/etc/prometheus/alert.rules"

scrape_configs:
  - job_name: 'n8n'
    scrape_interval: 5s
    static_configs:
      - targets: ['n8n:5678']

  - job_name: 'blackbox'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        - http://tuppli.com
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: 'supabase'
    scheme: https
    metrics_path: '/customer/v1/privileged/metrics'
    authorization:
      credentials: '[REDACTED_SUPABASE_SERVICE_KEY]'
    static_configs:
      - targets: ['xlupdcvldwprizuftkvf.supabase.co']
